# Which Apify actor collects live Amazon reviews, and how to call it.
#
# Pick a PAY-PER-RESULT actor that works on your Apify plan, and make `input`
# match its Input tab. Placeholders, filled per request:
#   {asin}  product ASIN       {max}  max reviews per request
#   {star}  one star rating, when split_by_star is true (one run per value)
#   {since} newest stored review date minus a week (drop the key if the actor
#           has no date filter; a key whose value is just "{since}" is omitted
#           when nothing is stored yet)
# The APIFY_REVIEWS_ACTOR environment variable overrides `actor`. Built-in
# profiles exist for axesso_data~amazon-reviews-scraper (needs a paid Apify
# plan) and junglee~amazon-reviews-scraper: set `actor` and delete `input`.
#
# Tested live on 2026-10-14 (Apify free plan):
#   jdtpnjtp~amazon-reviews             works: reads Amazon directly, no login,
#                                       $0.0018/review, newest first, goes past
#                                       Amazon's 100-per-filter limit. Asking for
#                                       "all stars" silently skipped 1-star
#                                       reviews, so stars are requested one by one.
#   stanvanrooy6~amazon-review-scraper-us  reads a Woot mirror: months stale or
#                                       empty for many best-sellers.
#   axesso_data~amazon-reviews-scraper  "usage only allowed for paying user".
#   web_wanderer~amazon-reviews-extractor  US full-text reviews need a login.
actor: jdtpnjtp~amazon-reviews
split_by_star: true
star_values: [one_star, two_star, three_star, four_star, five_star]
by_star: true            # judge truncation per star list
cap: "{max}"
input:
  products: ["{asin}"]
  country: us
  sort: recent
  starFilter: "{star}"
  maxReviewsPerAsin: "{max}"
  includeTopReviewsFallback: false
  stopOnError: false

# A product counts as live only if its newest review is this recent. Amazon
# moves reviews to newer listings, and old listings stop collecting them.
live_window_days: 120
# Known-active product used by the preflight check before every live fetch: if
# the actor returns nothing recent for it, the run stops instead of silently
# storing empty results (a paid-only actor "succeeds" with zero reviews).
check_asin: B07SGPJBZ6   # YETI Rambler 20 oz tumbler
# Actor price per scraped review, used only for the cost estimates printed by
# check-live (Apify charges your account's credit, console.apify.com/billing).
price_per_review: 0.0018
# Amazon shows the newest ~100 reviews per filter view. The actor accepts larger
# requests but pads them with reviews from other views (not contiguous in time;
# tested 2026-10-15: 111 returned for 150 asked, with a 405-day hole after the
# first ~100), which would make a cut-off list look complete. Never ask for more.
max_per_request: 100
