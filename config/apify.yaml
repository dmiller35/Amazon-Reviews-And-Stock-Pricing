# Which Apify actor collects live Amazon reviews, and how to call it.
#
# Pick a PAY-PER-RESULT actor (no monthly rental). Check its Input tab on
# apify.com and make `input` below match it exactly. Placeholders:
#   {asin}  product ASIN        {max}  max reviews per request
#   {star}  star filter value (only when by_star is true; one run per value)
# The APIFY_REVIEWS_ACTOR environment variable overrides `actor`. Built-in
# profiles also exist for axesso_data~amazon-reviews-scraper and
# junglee~amazon-reviews-scraper: set `actor` to one of them and delete `input`.

# stanvanrooy6 "Amazon Reviews Scraper (US)": pay per review (about $2 per 1,000;
# less on higher Apify plans), no Amazon login, US only, up to ~1,000 reviews per
# product in "expanded" mode. Field names come from its public examples; confirm
# them on the Input tab before the first run.
actor: stanvanrooy6~amazon-review-scraper-us
by_star: false
# A run that returns this many reviews may have been cut off (history truncated).
cap: "{max}"
input:
  products: ["{asin}"]
  maxReviewsPerProduct: "{max}"
  mode: expanded
