[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewtone"
version = "0.1.0"
description = "Amazon review tone -> revenue and stock-return predictor (replicates Jin, 'More than Words', SSRN 4291019)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reviewtone = "reviewtone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
